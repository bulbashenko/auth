# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.39/json-schema/configuration.json
#
# Deployment-specific part for bulbashenko.com: who may sign in where, and the registered OIDC clients.
# To add a service: add a client (or an access_control rule for forward-auth), push, redeploy.
# Client secrets are never stored here, only their PBKDF2 digests, passed in Base64 through the environment.

access_control:
  # Forward-auth (Traefik middleware) rules. An app behind the middleware is open to infra admins only, unless a more
  # specific rule above the catch-all says otherwise (first match wins).
  default_policy: 'deny'
  rules:
    # - domain: 'app.bulbashenko.com'
    #   subject: 'group:mail-users'
    #   policy: 'two_factor'
    - domain: '*.bulbashenko.com'
      subject: 'group:infra-admins'
      policy: 'two_factor'

identity_providers:
  oidc:
    # The Stalwart WebUI is a browser app that calls the token endpoint directly.
    cors:
      endpoints: ['token', 'userinfo', 'revocation']
      allowed_origins:
        - 'https://mailadmin.bulbashenko.com'

    authorization_policies:
      site_admins:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject: 'group:site-admins'
      infra_admins:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject: 'group:infra-admins'
      mail_users:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject: 'group:mail-users'

    lifespans:
      custom:
        # Mail clients refresh their access token every hour while running; a month away still needs a new sign-in.
        mail_client:
          access_token: '1 hour'
          refresh_token: '30 days'

    claims_policies:
      # Stalwart validates JWT access tokens offline and reads the identity from them.
      mail:
        access_token: ['preferred_username', 'email', 'name']

    clients:
      - client_id: 'bulbashenko-site'
        client_name: 'bulbashenko.com admin'
        client_secret: '{{ mustEnv "OIDC_SITE_SECRET_DIGEST_B64" | b64dec }}'
        authorization_policy: 'site_admins'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://bulbashenko.com/api/auth/oidc/callback'
          - 'http://localhost:3000/api/auth/oidc/callback'
        scopes: ['openid', 'profile', 'email', 'groups']
        token_endpoint_auth_method: 'client_secret_basic'

      # Coolify dashboard login (Settings > Authentication > OpenID Connect). Coolify sends the secret in the body.
      - client_id: 'coolify'
        client_name: 'Coolify'
        client_secret: '{{ mustEnv "OIDC_COOLIFY_SECRET_DIGEST_B64" | b64dec }}'
        authorization_policy: 'infra_admins'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://coolify.bulbashenko.com/auth/oidc/callback'
        scopes: ['openid', 'profile', 'email']
        token_endpoint_auth_method: 'client_secret_post'

      # Stalwart's admin console and account manager (client id is fixed by the WebUI bundle).
      - client_id: 'stalwart-webui'
        client_name: 'Mail settings'
        public: true
        authorization_policy: 'mail_users'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 year'
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://mailadmin.bulbashenko.com/admin/oauth/callback'
          - 'https://mailadmin.bulbashenko.com/account/oauth/callback'
        audience: ['stalwart']
        requested_audience_mode: 'implicit'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        response_types: ['code']
        grant_types: ['authorization_code', 'refresh_token']
        access_token_signed_response_alg: 'RS256'
        claims_policy: 'mail'
        token_endpoint_auth_method: 'none'

      # Thunderbird 155+ custom OAuth (see thunderbird-addon/). It listens on a random loopback port and sends the
      # redirect URI without a trailing slash; any port matches, the path must match exactly.
      - client_id: 'thunderbird'
        client_name: 'Thunderbird'
        public: true
        authorization_policy: 'mail_users'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 year'
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'http://127.0.0.1'
          - 'http://127.0.0.1/'
        audience: ['stalwart']
        requested_audience_mode: 'implicit'
        scopes: ['openid', 'email', 'profile', 'offline_access']
        response_types: ['code']
        grant_types: ['authorization_code', 'refresh_token']
        access_token_signed_response_alg: 'RS256'
        claims_policy: 'mail'
        lifespan: 'mail_client'
        token_endpoint_auth_method: 'none'
