# Authelia (OIDC provider, forward-auth portal) + LLDAP (user directory) + Valkey (sessions).
#
# Built for a Coolify "Docker Compose" application deployed from this repository.
# Requirements on the Coolify side:
#   - General > Build pipeline > "Preserve repository during deployment" ON (config files are bind-mounted).
#   - Advanced > "Connect to predefined network" ON (reach an external Postgres; lets other apps use LDAP).
#   - Domains: portal -> https://auth.example.com, lldap -> https://users.example.com (ports come from `expose`;
#     put the LLDAP UI behind an extra access layer, e.g. Authelia forward-auth or a VPN). Without the custom look,
#     drop `portal` and give the auth domain to `authelia` instead.
# Secrets named SERVICE_PASSWORD_* are generated by Coolify on first load.
# Everything marked ${VAR:?} must be filled in before the first deploy. See README.md.

services:
  authelia:
    image: authelia/authelia:4.39.28
    restart: unless-stopped
    # The first exposed port is what the proxy routes the service's domain to.
    expose:
      - "9091"
    # Lets SMTP_ADDRESS point at a mail server published on this host (submissions://host.docker.internal:465).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lldap:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      X_AUTHELIA_CONFIG: /config/configuration.yml,/config/instance.yml
      X_AUTHELIA_CONFIG_FILTERS: template
      TZ: ${TZ:-UTC}
      # Plain settings, read by the config templates.
      AUTH_PORTAL_URL: ${AUTH_PORTAL_URL:?}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:?}
      AUTH_LOG_LEVEL: ${AUTH_LOG_LEVEL:-info}
      LDAP_BASE_DN: ${LDAP_BASE_DN:?}
      POSTGRES_HOST: ${POSTGRES_HOST:?}
      SMTP_ADDRESS: ${SMTP_ADDRESS:?}
      SMTP_USERNAME: ${SMTP_USERNAME:?}
      SMTP_SENDER: ${SMTP_SENDER:?}
      # Name to verify the SMTP server's certificate against, when SMTP_ADDRESS uses another host name.
      SMTP_TLS_SERVER_NAME: ${SMTP_TLS_SERVER_NAME:-}
      # Base64 of the PEM RSA private key that signs tokens (scripts/gen-jwk.sh).
      OIDC_JWK_RS256_B64: ${OIDC_JWK_RS256_B64:?}
      # Base64 of the PBKDF2 digests of OIDC client secrets (scripts/new-client-secret.sh), used by instance.yml.
      # Base64 because the digests contain `$`, which Compose would interpolate.
      OIDC_SITE_SECRET_DIGEST_B64: ${OIDC_SITE_SECRET_DIGEST_B64:?}
      OIDC_COOLIFY_SECRET_DIGEST_B64: ${OIDC_COOLIFY_SECRET_DIGEST_B64:?}
      OIDC_HEADSCALE_SECRET_DIGEST_B64: ${OIDC_HEADSCALE_SECRET_DIGEST_B64:?}
      # Secrets, mapped straight onto Authelia configuration keys.
      AUTHELIA_SESSION_SECRET: ${SERVICE_PASSWORD_64_SESSION}
      AUTHELIA_SESSION_REDIS_PASSWORD: ${SERVICE_PASSWORD_VALKEY}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${SERVICE_PASSWORD_64_STORAGE}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${SERVICE_PASSWORD_64_RESETJWT}
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: ${SERVICE_PASSWORD_64_OIDCHMAC}
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD: ${SERVICE_PASSWORD_LDAPBIND}
      AUTHELIA_NOTIFIER_SMTP_PASSWORD: ${SMTP_PASSWORD:?}
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/instance.yml:/config/instance.yml:ro

  # The login portal with the site's look: proxies Authelia and adds theme/public/theme.css to its pages (see
  # theme/conf.d/default.conf). The auth domain points here; forward-auth still calls authelia:9091 directly.
  # Only directories are bind-mounted: Coolify pre-creates missing bind sources as directories, which then
  # blocks copying a single file of the same name from the repository.
  portal:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      - authelia
    volumes:
      - ./theme/conf.d:/etc/nginx/conf.d:ro
      - ./theme/public:/srv/theme:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/_theme/theme.css"]
      interval: 10s
      timeout: 3s
      retries: 5

  lldap:
    image: lldap/lldap:v0.6.3-alpine-rootless
    restart: unless-stopped
    expose:
      - "17170" # web UI (routed)
      - "3890" # LDAP, internal networks only
    environment:
      TZ: ${TZ:-UTC}
      LLDAP_HTTP_URL: ${LLDAP_HTTP_URL:?}
      LLDAP_LDAP_BASE_DN: ${LDAP_BASE_DN:?}
      LLDAP_LDAP_USER_DN: ${LLDAP_ADMIN_USERNAME:-lldap-admin}
      LLDAP_LDAP_USER_EMAIL: ${LLDAP_ADMIN_EMAIL:?}
      # Only applied when the admin user is first created; change it in the UI afterwards.
      LLDAP_LDAP_USER_PASS: ${SERVICE_PASSWORD_LLDAPADMIN}
      LLDAP_JWT_SECRET: ${SERVICE_PASSWORD_64_LLDAPJWT}
      LLDAP_KEY_SEED: ${SERVICE_PASSWORD_64_LLDAPSEED}
      LLDAP_DATABASE_URL: ${LLDAP_DATABASE_URL:?}
    volumes:
      - lldap-data:/data

  # One-shot: creates the groups and the Authelia bind user, then exits.
  lldap-bootstrap:
    image: lldap/lldap:v0.6.3-alpine
    restart: "no"
    exclude_from_hc: true
    depends_on:
      lldap:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/bootstrap/run.sh"]
    environment:
      LLDAP_URL: http://lldap:17170
      LLDAP_ADMIN_USERNAME: ${LLDAP_ADMIN_USERNAME:-lldap-admin}
      LLDAP_ADMIN_PASSWORD: ${SERVICE_PASSWORD_LLDAPADMIN}
      LDAP_BIND_PASSWORD: ${SERVICE_PASSWORD_LDAPBIND}
      LDAP_BIND_EMAIL: ${LDAP_BIND_EMAIL:?}
    volumes:
      - ./lldap/bootstrap:/bootstrap:ro

  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${SERVICE_PASSWORD_VALKEY}
    command: ["sh", "-c", 'exec valkey-server --requirepass "$$VALKEY_PASSWORD" --save 300 1 --appendonly no']
    healthcheck:
      test: ["CMD-SHELL", 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - valkey-data:/data

volumes:
  lldap-data:
  valkey-data:
