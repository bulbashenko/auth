# Sits between the proxy and Authelia and gives the portal the site's look. Authelia has no option for custom CSS
# (asset_path only covers the logo, favicon and translations), so this adds a stylesheet link to every HTML page it
# serves and hosts the stylesheet and fonts itself. Same origin, so Authelia's CSP (style-src 'self') allows it.
# Everything else passes through untouched, including the X-Forwarded-* headers set by the proxy.

server {
    listen 8080;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_theme/ {
        alias /srv/theme/;
        add_header Cache-Control "no-cache";
    }

    location /_theme/fonts/ {
        alias /srv/theme/fonts/;
        types { font/ttf ttf; }
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        # Resolved per request through Docker's DNS, so a recreated Authelia container (new IP) is picked up.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $authelia http://authelia:9091;
        proxy_pass $authelia;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # sub_filter only works on uncompressed responses.
        proxy_set_header Accept-Encoding "";

        sub_filter '</head>' '<link rel="stylesheet" href="/_theme/theme.css"></head>';
        sub_filter_once on;
    }
}
